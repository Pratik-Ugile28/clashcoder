<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClashCoder | Clan Members</title>
  <link rel="icon" type="image/png" href="https://api-assets.clashofclans.com/badges/70/iTrBFo3gpJRT2UELbo4fZkJELaKw4e0iXq8f3bT5VHI.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #18212f;
      --muted: #687386;
      --paper: #f5f7fa;
      --panel: #ffffff;
      --line: #e4e9f0;
      --accent: #df5b35;
      --accent-dark: #b94424;
      --soft-accent: #fff0ea;
      --shadow: 0 18px 50px rgba(24, 33, 47, 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 85% 0%, #ffe1d4 0, transparent 30%), var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    main { width: min(960px, calc(100% - 32px)); margin: 0 auto; padding: 64px 0; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent-dark);
      font: 700 0.78rem/1.2 Arial, sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(2.5rem, 7vw, 5rem); line-height: 0.95; max-width: 650px; }
    .intro { max-width: 540px; margin: 22px 0 34px; color: var(--muted); font: 1.05rem/1.6 Arial, sans-serif; }

    .search-panel, .results-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .search-panel { padding: 24px; border-radius: 8px 8px 0 0; }
    form { display: flex; gap: 12px; }
    label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border: 1px solid #ccd4df;
      border-radius: 4px;
      color: var(--ink);
      font: 1rem Arial, sans-serif;
    }
    input:focus { outline: 3px solid #ffd6c8; border-color: var(--accent); }
    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 4px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
      font: 700 0.95rem Arial, sans-serif;
    }
    button:hover { background: var(--accent-dark); }
    button:disabled { cursor: wait; opacity: 0.65; }

    .status { min-height: 24px; margin: 18px 0 0; color: var(--muted); font: 0.9rem Arial, sans-serif; }
    .status.error { color: #b42318; }
    .results-panel { display: none; overflow: hidden; border-top: 0; border-radius: 0 0 8px 8px; }
    .results-panel.visible { display: block; }
    .results-heading { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; padding: 22px 24px; border-bottom: 1px solid var(--line); }
    h2 { margin: 0; font-size: 1.45rem; }
    .count { color: var(--muted); font: 0.85rem Arial, sans-serif; }
    .sort-controls { display: flex; align-items: center; gap: 10px; padding: 16px 24px; border-bottom: 1px solid var(--line); font: 0.85rem Arial, sans-serif; }
    .sort-controls label { position: static; width: auto; height: auto; overflow: visible; clip: auto; color: var(--muted); }
    select { padding: 8px 28px 8px 10px; border: 1px solid #ccd4df; border-radius: 4px; color: var(--ink); background: #fff; font: inherit; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; font: 0.95rem Arial, sans-serif; }
    th, td { padding: 16px 24px; text-align: left; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); background: #fafbfd; font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; }
    tr:last-child td { border-bottom: 0; }
    .member-name { font-weight: 700; }
    .tag { color: var(--muted); font-size: 0.8rem; }
    .role { display: inline-block; padding: 5px 8px; border-radius: 3px; color: var(--accent-dark); background: var(--soft-accent); font-size: 0.78rem; text-transform: capitalize; }
    .stars { color: var(--accent-dark); font-weight: 700; }
    footer {
      margin-top: 48px;
      text-align: center;
      color: var(--muted);
      font: 0.95rem Arial, sans-serif;
    }

    @media (max-width: 600px) {
      main { padding: 36px 0; }
      form { flex-direction: column; }
      button { width: 100%; }
      .search-panel { padding: 18px; }
      .results-heading { padding: 18px; }
      th, td { padding: 14px 18px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">ClashCoder</p>
    <h1>See who is building your clan.</h1>
    <p class="intro">Enter a Clash of Clans clan tag to view its current members, roles, Town Hall levels, and trophies.</p>

    <section class="search-panel">
      <form id="clan-form">
        <label for="clan-tag">Clan tag</label>
        <input id="clan-tag" name="clanTag" placeholder="#CLAN123" autocomplete="off" required>
        <button type="submit" id="submit-button">Load members</button>
      </form>
      <p class="status" id="status" aria-live="polite">Your clan tag can be entered with or without #.</p>
    </section>

    <section class="results-panel" id="results-panel">
      <div class="results-heading">
        <div>
          <p class="eyebrow">Clan</p>
          <h2 id="clan-name">Clan members</h2>
          <span class="tag" id="clan-tag-display"></span>
        </div>
        <span class="count" id="member-count"></span>
      </div>
      <div class="sort-controls">
        <label for="sort-members">Sort by</label>
        <select id="sort-members">
          <option value="default">Original order</option>
          <option value="warStars">Total war stars</option>
          <option value="townHallLevel">Town Hall level</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Member</th><th>Role</th><th>Town Hall</th><th>Trophies</th><th>Total war stars</th></tr>
          </thead>
          <tbody id="member-list"></tbody>
        </table>
      </div>
    </section>

    <footer>
      <p>Made with 💜 by Pratik</p>
    </footer>
  </main>

  <script>
    const form = document.querySelector("#clan-form");
    const input = document.querySelector("#clan-tag");
    const button = document.querySelector("#submit-button");
    const status = document.querySelector("#status");
    const resultsPanel = document.querySelector("#results-panel");
    const memberList = document.querySelector("#member-list");
    const memberCount = document.querySelector("#member-count");
    const clanName = document.querySelector("#clan-name");
    const clanTagDisplay = document.querySelector("#clan-tag-display");
    const sortMembers = document.querySelector("#sort-members");
    let members = [];

    function renderMembers() {
      const sortedMembers = [...members];
      const sortKey = sortMembers.value;

      if (sortKey !== "default") {
        sortedMembers.sort((first, second) => second[sortKey] - first[sortKey]);
      }

      memberList.replaceChildren();
      sortedMembers.forEach((member) => {
        const row = document.createElement("tr");
        row.innerHTML = `<td><div class="member-name"></div><div class="tag"></div></td><td><span class="role"></span></td><td>${member.townHallLevel ?? "-"}</td><td>${member.trophies ?? "-"}</td><td class="stars">${member.warStars}</td>`;
        row.querySelector(".member-name").textContent = member.name;
        row.querySelector(".tag").textContent = member.tag;
        row.querySelector(".role").textContent = member.role;
        memberList.appendChild(row);
      });
    }

    sortMembers.addEventListener("change", renderMembers);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const clanTag = input.value.trim().replace(/^#/, "");
      if (!clanTag) return;

      button.disabled = true;
      status.className = "status";
      status.textContent = "Loading member profiles...";
      resultsPanel.classList.remove("visible");

      try {
        const response = await fetch(`/clan-war-members?clanTag=${encodeURIComponent(clanTag)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error?.message || data.message || "Unable to load this clan.");

        members = data.members;
        renderMembers();
        clanName.textContent = data.clan.name;
        clanTagDisplay.textContent = data.clan.tag;
        memberCount.textContent = `${data.members.length} member${data.members.length === 1 ? "" : "s"}`;
        status.textContent = "Clan members and lifetime war stars loaded.";
        resultsPanel.classList.add("visible");
      } catch (error) {
        status.className = "status error";
        status.textContent = error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
